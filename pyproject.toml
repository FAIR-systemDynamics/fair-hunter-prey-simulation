[build-system]
requires = ["setuptools>=77,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-hunter-prey"
version = "0.7.0"
description = "FAIR teaching workflows around the preserved Vensim and Stella Kaibab implementations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT AND CC-BY-4.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "Raphael Ginster"}, {name = "Matthias Papesch"}, {name = "Vasiliy Seibert"}]
dependencies = ["pysd==3.14.3", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]
keywords = ["system dynamics", "FAIR4RS", "Kaibab", "Vensim", "Stella", "PySD"]

[project.optional-dependencies]
teaching = ["rocrate>=0.14,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "build>=1,<2", "cffconvert==2.0.0", "reuse>=5,<7", "beautifulsoup4>=4.12,<5", "rdflib>=7,<8", "pyshacl>=0.30,<1"]

[project.scripts]
fair-hunter-prey = "fair_hunter_prey.cli:main"

[project.urls]
Repository = "https://github.com/FAIR-systemDynamics/fair-hunter-prey-simulation"
Documentation = "https://fair-systemdynamics.github.io/fair-hunter-prey-simulation/"
"Slides review" = "https://github.com/FAIR-systemDynamics/fair-hunter-prey-simulation/pull/1"

[tool.setuptools.packages.find]
where = ["src"]
